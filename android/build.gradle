buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()  // Changed from jcenter() - deprecated
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath 'com.google.gms:google-services:4.4.0'  // Updated
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.firebase:firebase-appdistribution-gradle:4.0.1'  // NEW - For easy updates
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()  // Changed from jcenter()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
